apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: poc-tradingagents-studio
  labels:
    app: web
    autopoc.io/project: tradingagents-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: quay.io/aicatalyst/tradingagents-studio-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TRADINGAGENTS_LOG_DIR
              value: "/opt/app-root/src/.tradingagents"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
